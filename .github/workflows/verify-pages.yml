name: Verify deployed Pages game
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: verify-public-pages
  cancel-in-progress: false
jobs:
  public-chromium:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble@sha256:678457c4c323b981d8b4befc57b95366bb1bb6aa30057b1269f6b171e8d9975a
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Resolve and verify the deployed Pages release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse
          def api(path):
              request = Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              with urlopen(request, timeout=30) as response:
                  return json.load(response)
          pages = api('/pages')
          build = api('/pages/builds/latest')
          assert build['status'] == 'built', build
          assert build['commit'] == os.environ['GITHUB_SHA'], 'Pages has not deployed this main commit'
          url = pages['html_url']
          parsed = urlparse(url)
          assert parsed.scheme == 'https' and parsed.netloc == 'cattownfilms.github.io'
          assert parsed.path == '/the-critic-city-run/'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('PAGES_URL=' + url + '\n')
          print('Testing deployed commit', build['commit'], 'at', url)
          PY
      - name: Install existing browser test tools
        run: |
          python -m pip install -r requirements-test.txt
      - name: Match temporary runner home ownership to the container user
        run: chown "$(id -u):$(id -g)" "$HOME"
      - name: Run existing regressions against public HTTPS
        run: |
          python tests/v9-presentation-browser.test.py --engine chromium --url "$PAGES_URL"
          python tests/v10-presentation-browser.test.py --engine chromium --url "$PAGES_URL"
          python tests/v11-presentation-browser.test.py --engine chromium --url "$PAGES_URL"
          python tests/v9-audio-browser.test.py --engine chromium --url "$PAGES_URL"
          python tests/gamepad-browser.test.py --engine chromium --url "$PAGES_URL"
          python tests/campaign-browser.test.py --engine chromium --url "$PAGES_URL"
          python tests/v8-gameplay-browser.test.py --engine chromium --url "$PAGES_URL"
          python tests/v8-opening-entry-browser.test.py --engine chromium --url "$PAGES_URL" --screenshots tests/screenshots-public
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-pages-chromium-results
          path: |
            tests/*-results.json
            tests/controller-*.png
            tests/screenshots-public/
            tests/screenshots-v9/
            tests/screenshots-v10/
            tests/screenshots-v11/
