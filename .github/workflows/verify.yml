name: Verify game and controller support
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Engine, controller, publication-safety and asset-route tests
        run: |
          node tests/engine.test.js
          node tests/franklin.test.js
          node tests/v4-engine.test.js
          node tests/gamepad.test.js
          python tests/publish.test.py
          python tests/site.test.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-results
          path: tests/*-results.json
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install browser test tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Build standalone parity edition
        run: python tools/build_standalone.py
      - name: Test actual multi-file site in browser engine
        run: |
          python -m http.server 8788 --bind 127.0.0.1 > /tmp/critic-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          python -c "import time,urllib.request; time.sleep(1); urllib.request.urlopen('http://127.0.0.1:8788/').read(100)"
          python tests/gamepad-browser.test.py --engine ${{ matrix.browser }} --url http://127.0.0.1:8788/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-${{ matrix.browser }}-results
          path: |
            tests/gamepad-*-results.json
            tests/controller-*.png
