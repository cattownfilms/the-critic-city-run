name: Verify Coming Attractions campaign and input
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install image-validation tools
        run: python -m pip install 'Pillow>=11.0'
      - name: Engine, controller, publication-safety and asset-route tests
        run: |
          node tests/engine.test.js
          node tests/franklin.test.js
          node tests/v4-engine.test.js
          node tests/gamepad.test.js
          node tests/campaign-engine.test.js
          node tests/v7-engine.test.js
          node tests/v8-engine.test.js
          node tests/cutscenes-v7.test.js
          node tests/audio-lifecycle.test.js
          node tests/v9-engine.test.js
          node tests/v10-engine.test.js
          python tests/publish.test.py
          python tests/site.test.py
          python tests/production-assets.test.py
          python tests/v10-assets.test.py
          python tools/export_script.py --check
          python -c "from tools.publish import inventory; print('Verified public files:', len(inventory()))"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-results
          path: tests/*-results.json
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Match requirements-test.txt without installing a changing host media stack.
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble@sha256:678457c4c323b981d8b4befc57b95366bb1bb6aa30057b1269f6b171e8d9975a
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser test tools
        run: |
          python -m pip install -r requirements-test.txt
      - name: Match temporary runner home ownership to the container user
        run: chown "$(id -u):$(id -g)" "$HOME"
      - name: Provide a real virtual audio sink for native media in the headless runner
        if: matrix.browser == 'firefox' || matrix.browser == 'webkit'
        run: |
          if ! command -v pulseaudio >/dev/null; then
            python - <<'PYAPT'
          from pathlib import Path
          import re
          for path in Path('/etc/apt/sources.list.d').glob('*.sources'):
              text = path.read_text().replace('http://archive.ubuntu.com/', 'https://archive.ubuntu.com/').replace('http://security.ubuntu.com/', 'https://security.ubuntu.com/')
              text = re.sub(r'^Components:.*$', 'Components: main universe', text, flags=re.M)
              path.write_text(text)
          PYAPT
            timeout 240 apt-get update -o Acquire::Retries=2 -o Acquire::https::Timeout=25
            timeout 180 apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          fi
          pulseaudio --daemonize=yes --exit-idle-time=-1 --log-target=file:/tmp/critic-pulse.log
          pactl load-module module-null-sink sink_name=critic_ci
          pactl set-default-sink critic_ci
          pactl info
      - name: Build standalone parity edition
        run: python tools/build_standalone.py
      - name: Test actual multi-file site in browser engine
        run: |
          python -m http.server 8788 --bind 127.0.0.1 > /tmp/critic-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          python -c "import time,urllib.request; time.sleep(1); urllib.request.urlopen('http://127.0.0.1:8788/').read(100)"
          python tests/v9-presentation-browser.test.py --engine ${{ matrix.browser }} --url local
          python tests/v10-presentation-browser.test.py --engine ${{ matrix.browser }} --url local
          GST_DEBUG=2 DEBUG=pw:browser python tests/v9-audio-browser.test.py --engine ${{ matrix.browser }} --url local
          python tests/gamepad-browser.test.py --engine ${{ matrix.browser }} --url local
          if [ "${{ matrix.browser }}" = webkit ]; then
            # Independent clean runs for the intermittent native media stall.
            # Fail immediately; these are repetitions, never retries on failure.
            for validation_pass in 1 2 3; do
              CRITIC_TRACE_AUDIO=1 timeout 5m python tests/campaign-browser.test.py --engine webkit --output "tests/campaign-webkit-pass-$validation_pass-results.json"
              CRITIC_TRACE_AUDIO=1 timeout 5m python tests/v8-loading-facing-browser.test.py --engine webkit --output "tests/v8-loading-facing-webkit-pass-$validation_pass-results.json"
            done
          else
            python tests/campaign-browser.test.py --engine ${{ matrix.browser }}
            CRITIC_TRACE_AUDIO=1 timeout 5m python tests/v8-loading-facing-browser.test.py --engine ${{ matrix.browser }} --output tests/v8-loading-facing-${{ matrix.browser }}-results.json
          fi
          python tests/v8-gameplay-browser.test.py --engine ${{ matrix.browser }}
          python tests/v8-archive-facing-browser.test.py --engine ${{ matrix.browser }}
          python tests/v7-scenes-browser.test.py --engine ${{ matrix.browser }}
          python tests/v8-opening-entry-browser.test.py --engine ${{ matrix.browser }}
      - name: Validate the standalone campaign and native audio
        if: matrix.browser == 'chromium'
        run: |
          python tests/campaign-browser.test.py --engine chromium --url standalone --output tests/campaign-chromium-offline-results.json
          mv tests/v9-audio-chromium-results.json tests/v9-audio-chromium-source-results.json
          python -m http.server 8788 --bind 127.0.0.1 > /tmp/critic-offline-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          python -c "import time,urllib.request; time.sleep(1); urllib.request.urlopen('http://127.0.0.1:8788/').read(100)"
          python tests/v9-audio-browser.test.py --engine chromium --url http://127.0.0.1:8788/The-Critic-Coming-Attractions-v10.html
          mv tests/v9-audio-chromium-results.json tests/v9-audio-chromium-offline-results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-${{ matrix.browser }}-results
          path: |
            tests/gamepad-*-results.json
            tests/campaign-*-results.json
            tests/v7-*-results.json
            tests/v8-*-results.json
            tests/v9-*-results.json
            tests/controller-*.png
            tests/screenshots-v9/
            tests/screenshots-v10/
